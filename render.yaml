services:
  - type: web
    name: it-troubleshooting-assistant
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python ingest.py"
    startCommand: "streamlit run app.py --server.port $PORT --server.address 0.0.0.0"
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9